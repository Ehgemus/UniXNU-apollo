schema_version = 1

[device]
name = "apollo"
soc = "SM8250"
os_profile = "ios-16.5-20F66"
summary = "Migrated from HakiOS, where iOS 16.5 reaches the home screen with touch, GPU, audio, Wi-Fi and battery. Format 2 configuration and hardware description in place; no UniXNU build and no UniXNU device boot yet."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "os-profiles/**", ".github/**", ".gitignore", "local.toml.example", "unixnu.lock", "LICENSE", "NOTICE", "package/LICENSE.MIT"]
inputs = ["Pistachio-Project/UniXNU-sm8250-common at 90fa1fd; xnu-8796.121.2 (c54f35c); the iOS 16.5 20F66 iPhone10,3 IPSW."]
configuration = ["board.toml selects SoC sm8250, OS profile ios-16.5-20F66 (os-profiles/, linked by scripts/install-os-profile.sh) and apollo_defconfig."]
procedure = ["scripts/install-os-profile.sh; then from UniXNU: ./unixnu defconfig apollo_defconfig -D ../UniXNU-apollo; ./unixnu fetch; ./unixnu status --json."]
findings = ["UniXNU reads OS profiles only from its own profiles/os/, so the iOS 16.5 profile is linked in until it is contributed upstream.", "The OS cryptex hash 2279bf44... was measured on the HakiOS image and matches UniXNU-nio's published pin for the same IPSW."]
completion = ["defconfig, fetch and status resolve; status shows arm64, sm8250, ios-16.5-20F66 and device profiles in order with the intended patch order."]
limits = ["The root volume UUID of 096-04088-077.dmg is not measured yet (os-profiles/ios-16.5-20F66/profile.toml)."]
next_action = ["Run the resolve commands, commit unixnu.lock, and measure the OS volume UUID."]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/pull-firmware.sh"]
inputs = ["Pistachio-Project/uefi-apollo: Mu-Silicium apolloPkg from HakiOS (KonaPkg, XBL BOOT.XF.3.2-00304-SM8250-2 drivers).", "The phone's firmware, pulled by scripts/pull-firmware.sh into .cache/firmware (42 files in proprietary-files.txt)."]
configuration = ["[firmware] config apollo, apollo.dsc, FD at 0x9FC00000 size 0x300000."]
procedure = ["scripts/pull-firmware.sh with the phone in LineageOS, rooted adb; ./unixnu firmware -D ../UniXNU-apollo --uefi ../uefi-apollo."]
findings = ["Under HakiOS the same apolloPkg boots via fastboot boot and hands off to HakiOS's own XNU loader; UniXNU replaces that loader with UniXNU.efi and DarwinBoot."]
completion = ["Firmware image builds, enters the UniXNU menu, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["uefi-apollo's UniXNU integration has not been built or booted."]
next_action = ["Build uefi-apollo with UniXNU's packages and reach the UniXNU menu on the phone."]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/apollo.dts"]
inputs = ["GICv3 at 0x17a00000 / 0x17a60000; eight cores, Affinity1 ids 0x0-0x700; 4 Cortex-A55 + 4 Cortex-A77; EPSS cpufreq domains."]
configuration = ["All eight cpu nodes enabled; E/P cluster types from the SoC DTSI."]
procedure = ["Follow https://unixnu.com/porting/bring-up for CPU entry checkpoints."]
findings = ["HakiOS runs all eight cores and the big cores at full speed (apollo_cpufreq=1) on xnu-8796 with its own SMP patch."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The SMP numbering and cluster patches for xnu-8796 are not in the SoC series yet."]
next_action = ["Split HakiOS's SMP changes into UniXNU-sm8250-common/patches/xnu."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = ["XBL memory map from uefi-apollo MemoryMapLib.c: HYP, AOP CMD DB, SMEM, TZApps, PIL, display regions."]
configuration = ["dts/apollo.dts: DRAM 0x80000000 + 6 GiB, reserved-memory nodes for each firmware region."]
procedure = ["Compile with dtc -i ../UniXNU-sm8250-common/dts and inspect the generated ADT."]
findings = ["The 8 GiB variant exists; the DTS uses the 6 GiB lower bound until measured."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["DRAM size not measured on the target unit; the DTS has not been compiled (dtc missing on the porting host)."]
next_action = ["Read the memory node of the firmware DTB on the phone and compile the DTS."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = ["RamBlock"]
paths = ["scripts/gpt-carve-darwin.py", "scripts/darwin-write.py"]
inputs = ["UFS on SM8250 at 0x1d84000; HakiOS's Darwin partition carved from userdata (entry 34 of LUN 0)."]
configuration = ["RamBlock root for bring-up, as HakiOS runs from RAM; [userdata] LBAs pending."]
procedure = ["Follow https://unixnu.com/porting/dual-system-partition with scripts/gpt-carve-darwin.py."]
findings = ["HakiOS keeps the system in RAM for a session; persistent /private/var is still in progress on apollo."]
completion = ["Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["No UFS driver for SM8250 in the catalog; ShengUfs is SM8550-only."]
next_action = ["Record the Darwin partition LBAs in board.toml [userdata]."]
evidence = []

[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["package/*Display*", "package/*Backlight*"]
inputs = ["Video-mode DSC panel mdss_dsi_j3s_37_02_0a_dsc_video, 1080x2400 at 0x9c000000, DPU INTF_1 at 0xae6b800, PM8150L WLED backlight."]
configuration = ["GopFramebuffer on the firmware's framebuffer; board ADT artwork-display-gamut sRGB, oled-display 0."]
procedure = ["Boot to the UniXNU menu, then XNU; check the framebuffer geometry and colors."]
findings = ["Under HakiOS, iOS draws black with the iPhone's P3 gamut on this sRGB panel; sRGB fixes it.", "HakiOS drives the refresh rate (60-144 Hz) and WLED brightness from patches/xnu/0001."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Backlight and refresh control are in the unapplied HakiOS patches."]
next_action = ["Verify the GOP framebuffer path, then move the WLED driver to a board service."]
evidence = []

[[area]]
id = "input"
status = "planned"
components = []
paths = ["scripts/touch-fw-from-boot.py", "package/*Touch*", "package/*Button*"]
inputs = ["Novatek NT36675 (j3s) on QUPv3 SE4 SPI; PM8150 power-on block and GPIO6 for the keys."]
configuration = ["Touch firmware from .cache/firmware/touch (proprietary-files.txt)."]
procedure = ["Apply patches/xnu/0001-0002 once their base is available; boot with apollo_touch=1 apollo_buttons=1."]
findings = ["HakiOS has working multitouch and power/volume keys on apollo through /dev/hakios-touch."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["ShengNovatekTouch targets NT36532 over a different transport; the HakiOS driver is not a catalog component."]
next_action = ["Port hakios.apollo_touch.c onto QcomGeniSpi and an IOHIDDevice source."]
evidence = []

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "package/*Adreno*"]
inputs = ["Adreno 650 with GMU at 0x3d6a000; a650_gmu.bin, a650_sqe.fw, a650_zap.* from .cache/firmware/gpu."]
configuration = ["No catalog component; HakiOS's A650 driver is in patches/xnu/0001 (apollo_adreno, ApolloGPU)."]
procedure = ["Boot with apollo_gpu=21 apollo_gpu_use=1 once the driver patches apply."]
findings = ["HakiOS renders the iOS UI on the A650 through Mesa freedreno (OpenGL ES); Metal is not available."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["Adreno740 and AdrenoMetal are A740/SM8550-only."]
next_action = ["Move the A650 driver into an Adreno650 component."]
evidence = []

[[area]]
id = "network"
status = "planned"
components = []
paths = ["package/ath11k-lx/**", "scripts/mk-ath11k.sh", "package/*Wifi*"]
inputs = ["QCA6390 on PCIe0; amss.bin (WLAN.HST.1.0.1.r1-01134), m3.bin, bd_j3s.elf, regdb.bin, board-2.bin."]
configuration = ["Linux ath11k built by scripts/mk-ath11k.sh over HakiOS's lx layer with package/ath11k-lx."]
procedure = ["HAKIOS=../hakios-new scripts/mk-ath11k.sh; boot with apollo_wifi=5 wifi_station=1."]
findings = ["HakiOS lists and joins Wi-Fi networks from Settings on apollo."]
completion = ["Scanning, association, address configuration and sustained receive/transmit traffic pass with the selected firmware."]
limits = ["Ath12kWifi does not cover the QCA6390; the build still needs a HakiOS checkout for its shared lx layer."]
next_action = ["Make an Ath11kWifi component from the lx layer and package/ath11k-lx."]
evidence = []

[[area]]
id = "audio"
status = "planned"
components = []
paths = ["scripts/acdb-mic.py", "package/*Adsp*", "package/*Audio*"]
inputs = ["ADSP firmware (adsp.mdt/.bNN), two CS35L41 B2 on QUPv3 SE3, the WCD938x/bolero microphones, Tutu ACDB calibration."]
configuration = ["Firmware from .cache/firmware/audio; mic topology generated by scripts/acdb-mic.py."]
procedure = ["Boot with apollo_audio=5 apollo_mic=4 once the driver patches apply."]
findings = ["HakiOS plays through the speakers and records from both microphones (Voice Memos)."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["Cirrus speaker-protection firmware does not run; HakiOS limits levels in software (apollo_guard)."]
next_action = ["Split the ADSP/APR transport into the SoC repository and the codec/amplifier setup into board services."]
evidence = []

[[area]]
id = "power"
status = "planned"
components = []
paths = ["package/*Battery*", "package/*Power*"]
inputs = ["PM8150B fuel gauge (fg-gen4) through the SPMI observer; AW8697 haptics on QUPv3 SE11; EPSS cpufreq."]
configuration = ["Haptics waveforms from .cache/firmware/haptic."]
procedure = ["Boot with apollo_battery=1 apollo_charger=3 apollo_haptic=5 apollo_cpufreq=1 once the driver patches apply."]
findings = ["HakiOS shows battery level and charging, and vibrates through the AW8697, on apollo."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["No sleep/resume under HakiOS."]
next_action = ["Move the SPMI fuel-gauge reader to a board service."]
evidence = []

[[area]]
id = "packaging"
status = "planned"
components = ["SoftwareAES", "AppleKeyStoreState"]
paths = ["patches/**", "package/userland/**", "scripts/package.sh", "scripts/install-os-profile.sh", "package/Kit.toml"]
inputs = ["patches/xnu/0001-0002 from HakiOS (against xnu-8796.121.2 plus HakiOS's core patch); UniXNU's arch series (written for xnu-10063)."]
configuration = ["Device patch series lists the HakiOS patches commented out; the OS series is empty."]
procedure = ["scripts/package.sh --check --os ios-16.5-20F66, then scripts/package.sh --os ios-16.5-20F66 --uefi ../uefi-apollo."]
findings = ["UniXNU's arch patches and XnuPrelink's security-init and sparse-index patches target xnu-10063; iOS 16.5 needs xnu-8796 versions of them.", "The HakiOS apollo drivers depend on HakiOS's shared core patch (input, QMI, lx, audio plug-in layers), which is not in this repository."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The kernel cannot build for iOS 16.5 until the arch and OS series exist for xnu-8796."]
next_action = ["Rebase the arch series and the XnuPrelink patches onto xnu-8796.121.2 in os-profiles/ios-16.5-20F66/patches/xnu."]
evidence = []

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["scripts/check-*", "scripts/probe-*"]
inputs = ["HakiOS's driver traces (frame pacing, hitch tracer) and the firmware log exporter."]
configuration = ["apollo_frames=1 apollo_hitch=1 in the HakiOS patches."]
procedure = ["Follow https://unixnu.com/porting/log-capture."]
findings = ["HakiOS traced animation hitches of 65-235 ms to frames arriving late from CoreAnimation, not to the display or GPU path."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["No UniXNU log capture yet."]
next_action = ["Enable the firmware log exporter in uefi-apollo and capture the first boot."]
evidence = []
